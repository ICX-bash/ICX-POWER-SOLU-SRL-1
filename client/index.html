      name="description"
      content="ICX Power Solutions — expertise internationale, conseil business, sourcing, commerce, études et immobilier."
    />
    <title>
      ICX Power Solutions · Les bons horizons commencent par les bonnes
      connexions
    </title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script
      nowprocket
      data-noptimize="1"
      data-cfasync="false"
      data-wpfc-render="false"
      seraph-accel-crit="1"
      data-no-defer="1"
      data-cmp-ab="2"
    >
      (function () {
        var script = document.createElement("script");
        script.async = 1;
        script.setAttribute("data-cmp-ab", "2");

    <style>
      .icx-boot {
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        align-content: center;
        justify-items: center;
        gap: 1rem;
        padding: 2rem;
        background: #09111f;
        color: #f8f5ed;
        font:
          500 1rem/1.5 system-ui,
          sans-serif;
        text-align: center;
      }
      .icx-boot__brand {
        color: #e6b84c;
        font-size: 0.8rem;
        font-weight: 800;
        letter-spacing: 0.18em;
      }
      .icx-boot__spinner {
        width: 1.5rem;
        height: 1.5rem;
        border: 2px solid rgb(248 245 237 / 25%);
        border-top-color: #e6b84c;
        border-radius: 50%;
        animation: icx-boot-spin 0.8s linear infinite;
      }
      @keyframes icx-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .icx-boot__spinner {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="icx-boot" role="status" aria-live="polite">
        <span class="icx-boot__brand">ICX POWER SOLUTIONS</span>
        <span>Ouverture du site…</span>
        <span class="icx-boot__spinner" aria-hidden="true"></span>
      </main>
    </div>
    <noscript>
      <p role="alert" style="padding: 1rem; text-align: center">
        Activez JavaScript dans votre navigateur pour utiliser le site ICX Power
        Solutions.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
