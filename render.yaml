services:
  - type: web
    name: icx-power-solutions
    runtime: node
    plan: starter
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        sync: false
      - key: OAUTH_SERVER_URL
        value: https://api.manus.im
      - key: SUPER_ADMIN_EMAIL
        value: icxps.sale@outlook.com
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: MICROSOFT_TENANT_ID
        value: consumers
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_REDIRECT_URI
        sync: false
      - key: INTEGRATION_ENCRYPTION_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_FROM_NAME
        value: ICX Power Solutions SRL
      - key: BREVO_FROM_EMAIL
        sync: false
      - key: BREVO_REPLY_TO
        value: icxps.sale@outlook.com
      - key: BUILT_IN_FORGE_API_URL
        sync: false
      - key: BUILT_IN_FORGE_API_KEY
        sync: false
      - key: AI_PREFERRED_PROVIDER
        value: gemini
      - key: AI_ENABLE_FALLBACK
        value: "false"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-latest
